[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "larder"
version = "0.1.0"
description = "Headless barcode-driven household inventory ledger"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.3,<3",
  "pyserial-asyncio-fast>=0.14,<1",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "structlog>=24.2,<26",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pillow>=11,<12",
  "python-barcode>=0.16,<1",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "testcontainers[postgres]>=4.7,<5",
]

[project.scripts]
larder = "larder.cli:app"

[project.urls]
Homepage = "https://github.com/DEADSEC-SECURITY/larder"
Repository = "https://github.com/DEADSEC-SECURITY/larder"
Issues = "https://github.com/DEADSEC-SECURITY/larder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/larder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires Docker and PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
