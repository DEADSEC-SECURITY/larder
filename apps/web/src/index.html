<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Larder</title>
  <base href="/">
  <!-- viewport-fit=cover lets the installed app paint under the notch and home
       indicator; the shell adds env(safe-area-inset-*) padding to compensate. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Barcode-driven household inventory — what you have, what expires, what to buy.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Installable app -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Kept in sync with the resolved theme by ThemeService. -->
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">

  <!-- iOS home-screen install -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Larder">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <app-root></app-root>
</body>
</html>
