map $http_x_forwarded_proto $larder_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # TLS is owned by the applications-host Caddy boundary. Keeping nginx on
    # the shared Docker network avoids publishing a second 80/443 listener.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    sendfile on;
    etag on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Server-Sent Events stream — no buffering, long-lived connection.
    location = /api/v1/web/events {
        proxy_pass http://api:8080/v1/web/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $larder_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Proxy the Larder API; the trailing slash strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $larder_forwarded_proto;
        add_header Cache-Control "no-store" always;
    }

    # PWA control files are NOT content-hashed, so they must never fall into the
    # immutable rule below — a cached ngsw-worker.js pins clients to a dead
    # release permanently. Exact-match locations outrank any regex location.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /safety-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        # nginx's bundled mime.types has no mapping for .webmanifest.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Angular hashes these build artifacts, so a year-long cache can never
    # serve an old release under a new filename.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate the tiny app shell. Its ETag normally turns this into a
    # 304, while a deployment can immediately point at the new hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback. Non-hashed files also revalidate instead of becoming stale.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
